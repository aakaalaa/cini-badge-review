<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>badge review</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#18181b;color:#f4f4f5;font:16px/1.3 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-size:22px;font-weight:700}
.count{font-size:13px;color:#a1a1aa;text-align:right}
.ver{margin:2px 0 8px;font-size:14px;color:#c4b5fd}
.ver b{color:#fff}
.stage{width:100%;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#ddd}
.stage img{width:100%;height:100%;display:block;object-fit:contain}
.chips{display:flex;gap:8px;margin:12px 0 8px}
.chip{flex:1;padding:12px 4px;border-radius:999px;border:2px solid #3f3f46;background:#27272a;color:#e4e4e7;font-size:15px;font-weight:600}
.chip.on.approve{background:#16a34a;border-color:#16a34a;color:#fff}
.chip.on.iterate{background:#d97706;border-color:#d97706;color:#fff}
.chip.on.delete{background:#dc2626;border-color:#dc2626;color:#fff}
textarea{width:100%;min-height:84px;border-radius:16px;border:2px solid #3f3f46;background:#27272a;color:#fff;padding:12px;font:16px/1.3 inherit;resize:vertical}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{flex:1;padding:14px;border-radius:999px;border:0;background:#4f46e5;color:#fff;font-size:16px;font-weight:700}
.nav button.sec{background:#3f3f46}
.saved{font-size:12px;color:#71717a;height:16px;margin-top:6px;text-align:center}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:#3f3f46}
.dot.done{background:#16a34a}.dot.warn{background:#d97706}.dot.bad{background:#dc2626}.dot.cur{outline:2px solid #fff}
.links{text-align:center;margin-top:10px;font-size:13px}.links a{color:#a1a1aa;margin:0 8px}
</style></head><body><div id="app"></div>
<script>
let M=[],S={},pages=[],i=0,bg={};
const $=s=>document.querySelector(s);
async function init(){
  M=await (await fetch('manifest.json')).json();
  S=JSON.parse(localStorage.getItem('decisions')||'{}');
  for(const b of M)b.versions.forEach((v,k)=>pages.push({b,v,k,n:b.versions.length}));
  const h=parseInt(location.hash.slice(1));i=h>=0&&h<pages.length?h:(+localStorage.getItem('pg')||0);
  show(i);
}
function colorFor(b){
  return new Promise(res=>{
    if(bg[b.name])return res(bg[b.name]);
    const a=b.versions.find(v=>v.kind==='anim');
    if(!a)return res('#ddd7f0');
    const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');
      x.drawImage(im,3,3,1,1,0,0,1,1);const d=x.getImageData(0,0,1,1).data;bg[b.name]=`rgb(${d[0]},${d[1]},${d[2]})`}catch(e){bg[b.name]='#ddd7f0'}res(bg[b.name])};
    im.onerror=()=>res('#ddd7f0');im.src=a.url;
  });
}
function st(p){return S[p.v.id]||{status:'',note:''}}
async function show(n){
  i=Math.max(0,Math.min(pages.length-1,n));localStorage.setItem('pg',i);history.replaceState(null,'','#'+i);
  const p=pages[i],s=st(p);
  const color=await colorFor(p.b);
  const multi=p.n>1?`version <b>${p.k+1} of ${p.n}</b> · `:'';
  $('#app').innerHTML=`
  <div class="top"><div class="name">${p.b.name.replace(/_/g,' ')}</div><div class="count">badge ${M.indexOf(p.b)+1}/${M.length} · page ${i+1}/${pages.length}</div></div>
  <div class="ver">${multi}${p.v.label}</div>
  <div class="stage" style="background:${color}"><img src="${p.v.url}" alt=""></div>
  <div class="chips">${['approve','iterate','delete'].map(k=>`<button class="chip ${k} ${s.status===k?'on':''}" data-k="${k}">${k==='iterate'?'iterate from':k}</button>`).join('')}</div>
  <textarea id="note" placeholder="notes…">${(s.note||'').replace(/</g,'&lt;')}</textarea>
  <div class="saved" id="saved"></div>
  <div class="nav"><button class="sec" id="prev">← back</button><button id="next">next →</button></div>
  <div class="dots">${pages.map((q,j)=>{const t=st(q).status;return `<div class="dot ${t==='approve'?'done':t==='iterate'?'warn':t==='delete'?'bad':''} ${j===i?'cur':''}" data-j="${j}"></div>`}).join('')}</div>
  <div class="links"><a href="#" id="rep">copy report</a><a href="#" id="jump">jump to…</a></div>`;
  $('#prev').onclick=()=>show(i-1);$('#next').onclick=()=>show(i+1);
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const cur=st(p);save(p,{...cur,status:cur.status===c.dataset.k?'':c.dataset.k});show(i)});
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>show(+d.dataset.j));
  let t;$('#note').oninput=e=>{clearTimeout(t);t=setTimeout(()=>save(p,{...st(p),note:e.target.value},true),400)};
  $('#rep').onclick=async e=>{e.preventDefault();const t=report();try{await navigator.clipboard.writeText(t);alert('report copied')}catch(x){prompt('copy this',t)}};
  $('#jump').onclick=e=>{e.preventDefault();const q=prompt('badge name (e.g. comedy)');if(!q)return;const j=pages.findIndex(x=>x.b.name.includes(q.toLowerCase().replace(/ /g,'_')));if(j>=0)show(j)};
  window.scrollTo(0,0);
}
async function save(p,val,quiet){
  S[p.v.id]=val;
  localStorage.setItem('decisions',JSON.stringify(S));const e=$('#saved');if(e)e.textContent='saved on this phone'
}
function report(){const L=[];for(const b of M)for(const v of b.versions){const q=S[v.id];if(q&&(q.status||q.note))L.push(`${b.name} / ${v.label} [${v.url.replace('assets/','')}]: ${q.status||''} ${q.note||''}`.trim())}return L.join('\n')}
let x0=null;
addEventListener('touchstart',e=>{if(e.target.tagName==='TEXTAREA')return;x0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>80)show(i+(dx<0?1:-1))});
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
init();
</script></body></html>
